name: PRVN Pages Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      live_deployment_url:
        description: 'Existing PRVN immutable deployment URL to verify without deployment credentials'
        required: false
        type: string

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.live_deployment_url == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Verify the legacy location-only embed
        env:
          PRVN_CHAT_TEST_EMBED: 'legacy'
        run: npm run test:e2e -- tests/e2e/leadconnector.spec.ts
      - name: Verify chat is absent when disabled
        env:
          PLAYWRIGHT_CHAT_DISABLED: 'true'
          PUBLIC_LEADCONNECTOR_ENABLED: 'false'
          PUBLIC_LEADCONNECTOR_EMBED: ''
          PUBLIC_LEADCONNECTOR_LOCATION_ID: ''
          PUBLIC_LEADCONNECTOR_WIDGET_ID: ''
        run: npm run test:e2e -- tests/e2e/leadconnector-disabled.spec.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  verify-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_deployment_url != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LIVE_SITE_URL: ${{ inputs.live_deployment_url }}
      PLAYWRIGHT_CHAT_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require the exact PRVN deployment and source commit
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.LIVE_SITE_URL);
          if (url.protocol !== 'https:' || url.username || url.password || url.port || url.search || url.hash || url.pathname !== '/' ||
              !/^[a-f0-9]{8}\.prvn-epoxy-solutions-site\.pages\.dev$/.test(url.hostname)) {
            throw new Error('Only an immutable deployment URL for the existing PRVN Pages project is allowed.');
          }
          const response = await fetch(new URL('/version.json', url), { redirect: 'error' });
          if (!response.ok || (await response.json()).commit !== process.env.GITHUB_SHA) {
            throw new Error('The deployment does not match this exact source commit.');
          }
          console.log('Exact PRVN deployment and source commit verified.');
          NODE
      - run: npm ci
      - name: Install browsers for live acceptance
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual disabled Cloudflare deployment
        run: npm run test:e2e -- tests/e2e/leadconnector-disabled.spec.ts
      - name: Upload live Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for production deployment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required for production deployment."; exit 1; }
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect production Pages chat configuration
        run: node scripts/load-leadconnector-pages-config.mjs production
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name prvn-epoxy-solutions-site --branch main
      - name: Install browsers for deployed chat smoke tests
        if: env.PUBLIC_LEADCONNECTOR_ENABLED == 'false'
        run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed public and private routes have no chat when disabled
        if: env.PUBLIC_LEADCONNECTOR_ENABLED == 'false'
        env:
          LIVE_SITE_URL: ${{ steps.pages.outputs.deployment-url }}
          PLAYWRIGHT_CHAT_DISABLED: 'true'
        run: |
          test -n "$LIVE_SITE_URL" || { echo "Cloudflare did not return the deployed preview URL."; exit 1; }
          npm run test:e2e -- tests/e2e/leadconnector-disabled.spec.ts

  preview:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required for preview deployment."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required for preview deployment."; exit 1; }
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect production public chat identifiers before preview acceptance
        run: >-
          node --input-type=module -e "import { loadPagesChatConfig } from './scripts/load-leadconnector-pages-config.mjs';
          loadPagesChatConfig('production').then(config => console.log(JSON.stringify(config))).catch(error => { console.error(error.message); process.exitCode = 1; });"
      - name: Inspect preview Pages chat configuration
        run: node scripts/load-leadconnector-pages-config.mjs preview
      - run: npm run build
      - name: Deploy preview to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name prvn-epoxy-solutions-site --branch ${{ github.ref_name }}
      - name: Install browsers for deployed chat smoke tests
        if: env.PUBLIC_LEADCONNECTOR_ENABLED == 'false'
        run: npx playwright install --with-deps chromium webkit
      - name: Verify deployed public and private routes have no chat when disabled
        if: env.PUBLIC_LEADCONNECTOR_ENABLED == 'false'
        env:
          LIVE_SITE_URL: ${{ steps.pages.outputs.deployment-url }}
          PLAYWRIGHT_CHAT_DISABLED: 'true'
        run: |
          test -n "$LIVE_SITE_URL" || { echo "Cloudflare did not return the deployed preview URL."; exit 1; }
          npm run test:e2e -- tests/e2e/leadconnector-disabled.spec.ts
